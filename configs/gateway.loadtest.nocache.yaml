# E5 "cache off" baseline: identical to gateway.loadtest.yaml except
# /v1/payments has no cache_ttl, so every eventual read is a cache bypass.
split_enabled: true

pools:
  read:
    targets:
      - http://payments-read-1:9000
      - http://payments-read-2:9000
  write:
    targets:
      - http://payments-write-1:9000

routes:
  - method: POST
    path: /v1/payments
    class: write
    idempotency: required
  - method: POST
    path: /v1/payments/{id}/execute
    class: write
    idempotency: required
  - method: POST
    path: /v1/payments/{id}/refund
    class: write
    idempotency: required
  - method: GET
    path: /v1/payments/{id}
    class: read
    consistency: strong
  - method: GET
    path: /v1/payments
    class: read
    consistency: eventual
  - method: GET
    path: /v1/balance
    class: read
    consistency: eventual

rate_limits:
  per_ip_per_min: 1000000
  per_merchant_read_per_min: 1000000
  per_merchant_write_per_min: 1000000

read_your_writes:
  ttl: 5s

timeouts:
  upstream: 5s

health_check:
  path: /healthz
  interval: 5s
  timeout: 1s
  unhealthy_after: 2
  healthy_after: 2

ml:
  mode: off
  model_path: /app/models/iforest-v1.json
